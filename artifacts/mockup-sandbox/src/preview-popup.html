<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AuroraShield</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="shell">

    <!-- ── HEADER ───────────────────────────────────── -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div class="brand-block">
          <span class="brand">Aurora<strong>Shield</strong></span>
          <span class="tagline">Threat Intelligence</span>
        </div>
      </div>
      <div class="status-block" id="statusBlock">
        <div class="pulse-dot" id="pulseDot"></div>
        <span class="status-text" id="statusText">Active</span>
      </div>
    </header>

    <!-- ── RISK GAUGE ─────────────────────────────────── -->
    <section class="gauge-section">
      <div class="gauge-wrap">
        <svg class="gauge-svg" viewBox="0 0 120 120" width="120" height="120">
          <defs>
            <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" class="grad-start" />
              <stop offset="100%" class="grad-end" />
            </linearGradient>
          </defs>
          <!-- Track -->
          <circle class="gauge-track" cx="60" cy="60" r="48" />
          <!-- Arc -->
          <circle class="gauge-arc" id="gaugeArc" cx="60" cy="60" r="48"
            stroke-dasharray="301.6" stroke-dashoffset="301.6" />
          <!-- Glow -->
          <circle class="gauge-glow" id="gaugeGlow" cx="60" cy="60" r="48"
            stroke-dasharray="301.6" stroke-dashoffset="301.6" />
        </svg>
        <div class="gauge-inner">
          <div class="gauge-score" id="gaugeScore">0</div>
          <div class="gauge-label" id="gaugeLabel">Scanning...</div>
        </div>
      </div>

      <div class="scan-indicator" id="scanIndicator">
        <div class="scan-bar"></div>
        <span>Analyzing page...</span>
      </div>
    </section>

    <!-- ── THREAT BREAKDOWN ──────────────────────────── -->
    <section class="breakdown">
      <div class="section-head">Threat Breakdown</div>

      <div class="threat-row">
        <div class="threat-icon inject">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </div>
        <div class="threat-label">Prompt Injection</div>
        <div class="mini-bar-wrap">
          <div class="mini-bar" id="barInject"></div>
        </div>
        <div class="threat-pct" id="pctInject">--</div>
      </div>

      <div class="threat-row">
        <div class="threat-icon phish">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <div class="threat-label">Phishing</div>
        <div class="mini-bar-wrap">
          <div class="mini-bar" id="barPhish"></div>
        </div>
        <div class="threat-pct" id="pctPhish">--</div>
      </div>

      <div class="threat-row">
        <div class="threat-icon url">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </div>
        <div class="threat-label">URL Risk</div>
        <div class="mini-bar-wrap">
          <div class="mini-bar" id="barUrl"></div>
        </div>
        <div class="threat-pct" id="pctUrl">--</div>
      </div>
    </section>

    <!-- ── LIVE FEED ──────────────────────────────────── -->
    <section class="feed-section">
      <div class="section-head">
        Live Detection Feed
        <span class="feed-dot" id="feedDot"></span>
      </div>
      <div class="feed-list" id="feedList">
        <div class="feed-empty">Shield is monitoring this page</div>
      </div>
    </section>

    <!-- ── ACTIONS ────────────────────────────────────── -->
    <div class="actions">
      <button class="btn btn-primary" id="btnScan">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        Scan Page
      </button>
      <button class="btn btn-ghost" id="btnDetails">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        View Details
      </button>
      <button class="btn btn-danger" id="btnReport">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Report
      </button>
    </div>

    <!-- ── FOOTER ─────────────────────────────────────── -->
    <footer class="footer">
      <span class="footer-version">v1.0.0</span>
      <a href="#" id="dashLink" class="footer-link">Open Dashboard</a>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
